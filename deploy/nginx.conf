# 將 courses.example.com 與憑證路徑替換成自己的網域與有效憑證。
server {
    listen 80;
    server_name courses.example.com;
    return 301 https://courses.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name courses.example.com;
    ssl_certificate /etc/letsencrypt/live/courses.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/courses.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 200m;

    location /static/ {
        alias /srv/course-reader/staticfiles/;
        add_header X-Content-Type-Options nosniff always;
    }

    # 公開素材範例：不是付費音檔保護；正式販售前必須替換。
    location /media/ {
        alias /srv/course-reader/media/;
        autoindex off;
        types {
            audio/mpeg mp3;
            image/jpeg jpg jpeg;
            image/png png;
            image/webp webp;
        }
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
