# 將 courses.example.com 與憑證路徑替換成自己的網域與有效憑證。
server {
    listen 80;
    server_name courses.example.com;
    return 301 https://courses.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name courses.example.com;
    ssl_certificate /etc/letsencrypt/live/courses.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/courses.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 200m;

    location /static/ {
        alias /srv/course-reader/staticfiles/;
        add_header X-Content-Type-Options nosniff always;
    }

    # 僅書封可公開；舊音檔 URL 一律拒絕。
    location /media/ {
        return 404;
    }

    location /media/covers/ {
        alias /srv/course-reader/media/covers/;
        autoindex off;
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/webp webp;
        }
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    # 只能由 Django 通過購買權限檢查後內部轉送，外部請求會得到 404。
    location /_private_audio/ {
        internal;
        alias /srv/course-reader/private_media/;
        types { audio/mpeg mp3; }
        default_type application/octet-stream;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
